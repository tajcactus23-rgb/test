name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: List APK outputs
        run: find app/build/outputs/apk -type f -name '*.apk' -print

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: BlueMeanie ${{ github.ref_name }}
          body: |
            Dynamic fullscreen radar hardening build.

            - Edge-to-edge immersive fullscreen
            - Adaptive radar sizing for different screens
            - Unique radar display silhouettes
            - Tactical/stealth mode control shifted right
            - Backup, cleartext traffic, and build hardening fixes
          files: app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true
